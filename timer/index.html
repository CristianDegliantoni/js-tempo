<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Recap</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <h2 id="loading-title">Loading...</h2>
        <div id="progress"></div>
    </div>

    <div class="container">
        <h2>Cronometro</h2>
        <p>
            <span>Tempo trascorso: </span>
            <span id="cronometro"></span>
        </p>
        <button id="play-btn">Avvia timer</button>
        <button id="stop-btn" disabled>Stop timer</button>
        <button id="reset-btn" disabled>Reset timer</button>
    </div>

    <script src="./main.js"></script>
</body>

</html>
